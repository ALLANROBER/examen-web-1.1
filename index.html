<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>My perfil de usuario</title>
  <link rel="stylesheet" href="./bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="container py-4">
    <h1>Perfil</h1>
    <h2>Usuario</h2>
    <h3>Detalles</h3>

    <p>Bienvenido a mi perfil de usuario.</p>
    <p>Visita <a href="#">GitHub</a> o <a href="#">Mi web</a>.</p>

    <img id="avatar" src="https://via.placeholder.com/120" alt="Avatar" class="rounded-circle mb-2">

    <ul>
      <li>Programación</li>
      <li>Videojuegos</li>
    </ul>
    <ol>
      <li>Graduado</li>
      <li>Certificación</li>
    </ol>

    <table class="table table-bordered mb-3">
      <tr><th>Nombre</th><td id="nombre">Allan G</td></tr>
      <tr><th>Correo</th><td id="correo">aguamuchg@miumg.edu.gt</td></tr>
    </table>

    <form id="formPerfil">
      <input type="text" id="inputNombre" placeholder="Nombre" class="form-control mb-2">
      <input type="email" id="inputCorreo" placeholder="Correo" class="form-control mb-2">
      <textarea id="inputBio" rows="2" placeholder="Bio" class="form-control mb-2"></textarea>
      <input type="submit" value="Guardar" class="btn btn-primary">
    </form>
  </div>

  <script src="js/jquery.min.js"></script>
  <script src=".//bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="./js/script.js"></script>
</body>
</html>
